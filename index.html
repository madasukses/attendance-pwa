<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1B8A3E">
    <title>Attendance - Nosada Farma</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1B8A3E;
            --primary-dark: #0F6A2E;
            --success: #10B981;
            --danger: #EF4444;
            --gray-100: #F3F4F6;
            --gray-200: #E5E7EB;
            --gray-300: #D1D5DB;
            --gray-700: #374151;
            --gray-900: #111827;
        }

        html, body {
            height: 100%;
            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fff;
            color: var(--gray-900);
        }

        body {
            display: flex;
            flex-direction: column;
            padding-top: max(12px, env(safe-area-inset-top));
        }

        .header {
            background: var(--primary);
            color: white;
            padding: 16px 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
        }

        .header-user {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 4px;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 20px;
        }

        /* LOGIN SCREEN */
        .login-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        .login-box {
            width: 100%;
            max-width: 300px;
        }

        .login-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .login-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .login-subtitle {
            font-size: 13px;
            color: var(--gray-700);
            margin-bottom: 24px;
        }

        .login-input {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--gray-300);
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 12px;
            font-family: inherit;
        }

        .login-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(27, 138, 62, 0.1);
        }

        .btn {
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:active {
            background: var(--primary-dark);
        }

        .btn-primary:disabled {
            background: var(--gray-300);
            cursor: not-allowed;
        }

        .btn-logout {
            background: var(--gray-200);
            color: var(--gray-900);
            font-size: 12px;
            padding: 8px 12px;
            width: auto;
        }

        /* MAIN SCREEN */
        .main-screen {
            display: none;
        }

        .main-screen.active {
            display: flex;
            flex-direction: column;
        }

        .status-msg {
            padding: 12px 16px;
            margin-bottom: 16px;
            border-radius: 8px;
            font-size: 13px;
            display: none;
            animation: slideIn 0.3s;
        }

        .status-msg.show {
            display: block;
        }

        .status-msg.success {
            background: #DCFCE7;
            color: #166534;
            border: 1px solid #86EFAC;
        }

        .status-msg.error {
            background: #FEE2E2;
            color: #991B1B;
            border: 1px solid #FCA5A5;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .clock-section {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #f5f5f5 0%, #fafafa 100%);
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .clock {
            font-size: 48px;
            font-weight: 300;
            letter-spacing: 2px;
            font-variant-numeric: tabular-nums;
            font-family: 'Courier New', monospace;
            margin-bottom: 8px;
        }

        .date {
            font-size: 12px;
            color: var(--gray-700);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--gray-700);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--gray-300);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(27, 138, 62, 0.1);
        }

        .buttons-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        .btn-large {
            padding: 20px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-checkin {
            background: var(--success);
            color: white;
        }

        .btn-checkin:active {
            background: #059669;
        }

        .btn-checkout {
            background: var(--danger);
            color: white;
        }

        .btn-checkout:active {
            background: #dc2626;
        }

        #fotoInput {
            display: none;
        }

        .photo-preview {
            width: 100%;
            max-height: 150px;
            object-fit: cover;
            border-radius: 8px;
            margin-top: 8px;
        }

        .location-info {
            padding: 12px;
            background: var(--gray-100);
            border-radius: 8px;
            font-size: 12px;
            color: var(--gray-700);
            margin-bottom: 16px;
        }

        .location-info strong {
            color: var(--gray-900);
        }

        .history-section {
            padding: 16px;
            background: var(--gray-100);
            border-radius: 8px;
            font-size: 12px;
        }

        .history-item {
            padding: 8px 0;
            border-bottom: 1px solid var(--gray-200);
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-time {
            font-weight: 600;
            color: var(--primary);
        }

        .empty {
            text-align: center;
            padding: 20px;
            color: var(--gray-700);
        }

        .logout-btn-wrapper {
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="login-screen">
        <div class="login-box">
            <div class="login-icon">🏢</div>
            <div class="login-title">Nosada Farma</div>
            <div class="login-subtitle">Sistem Absensi</div>
            
            <input 
                type="text" 
                id="usernameInput" 
                class="login-input" 
                placeholder="Username"
                autocomplete="off"
            >
            
            <button class="btn btn-primary" onclick="login()">Masuk</button>
        </div>
    </div>

    <!-- MAIN SCREEN -->
    <div id="mainScreen" class="main-screen">
        <div class="header">
            <h1>📍 Attendance Nosada</h1>
            <div class="header-user" id="userDisplay">User</div>
        </div>

        <div class="container">
            <div id="statusMsg" class="status-msg"></div>

            <div class="clock-section">
                <div class="clock" id="clock">00:00:00</div>
                <div class="date" id="dateDisplay">Senin, 1 Januari 2024</div>
            </div>

            <div class="location-info" id="locationInfo">
                📍 Mencari lokasi...
            </div>

            <div class="form-group">
                <label class="form-label">Nama Karyawan</label>
                <input 
                    type="text" 
                    id="namaInput" 
                    class="form-control" 
                    placeholder="Pilih dari dropdown"
                    list="namaSuggestions"
                >
                <datalist id="namaSuggestions"></datalist>
            </div>

            <div class="form-group">
                <label class="form-label">Foto (Opsional)</label>
                <button class="btn btn-primary" onclick="document.getElementById('fotoInput').click()" style="margin-bottom: 8px;">
                    📸 Ambil Foto
                </button>
                <input type="file" id="fotoInput" accept="image/*" capture="environment">
                <img id="photoPreview" class="photo-preview" style="display: none;">
            </div>

            <div class="buttons-group">
                <button class="btn-large btn-checkin" onclick="submitCheckin()">
                    ✓<br>CHECK IN
                </button>
                <button class="btn-large btn-checkout" onclick="submitCheckout()">
                    ✗<br>CHECK OUT
                </button>
            </div>

            <div class="history-section" style="margin-top: 20px;">
                <div style="font-weight: 600; margin-bottom: 12px;">Riwayat Hari Ini</div>
                <div id="historyList" class="empty">Belum ada data</div>
            </div>

            <div class="logout-btn-wrapper">
                <button class="btn btn-logout" onclick="logout()">Keluar</button>
            </div>
        </div>
    </div>

    <script>
        // CONFIG
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbxc7YDPcq_7BUdf_Pdj-CoD41NPDuiCpu5VI2gQsMik_R0xn_AE33rmw1YUgKKKknH8Ag/exec';
        const VALID_USERS = ['mada', 'istri', 'novita', 'dian', 'fara', 'alya'];
        const KARYAWAN = ['Mada', 'Istri', 'Novita', 'Dian', 'Fara', 'Alya'];

        let currentUser = null;
        let currentPhoto = null;
        let currentLat = null;
        let currentLng = null;

        // INIT
        document.addEventListener('DOMContentLoaded', function() {
            checkLogin();
            setupPhotoInput();
            loadKaryawanList();
            
            if (currentUser) {
                updateClock();
                getLocation();
                loadTodayHistory();
                setInterval(updateClock, 1000);
                setInterval(loadTodayHistory, 30000);
            }
        });

        // LOGIN
        function login() {
            const username = document.getElementById('usernameInput').value.trim().toLowerCase();
            
            if (!username) {
                showStatus('Username harus diisi', 'error');
                return;
            }

            if (!VALID_USERS.includes(username)) {
                showStatus('Username tidak ditemukan', 'error');
                return;
            }

            localStorage.setItem('currentUser', username);
            currentUser = username;
            showLoginScreen(false);
            
            updateClock();
            getLocation();
            loadTodayHistory();
            setInterval(updateClock, 1000);
            setInterval(loadTodayHistory, 30000);
        }

        function checkLogin() {
            const user = localStorage.getItem('currentUser');
            if (user && VALID_USERS.includes(user)) {
                currentUser = user;
                showLoginScreen(false);
            } else {
                showLoginScreen(true);
            }
        }

        function logout() {
            if (confirm('Keluar dari aplikasi?')) {
                localStorage.removeItem('currentUser');
                currentUser = null;
                showLoginScreen(true);
                document.getElementById('usernameInput').value = '';
            }
        }

        function showLoginScreen(show) {
            document.getElementById('loginScreen').style.display = show ? 'flex' : 'none';
            document.getElementById('mainScreen').classList.toggle('active', !show);
            
            if (!show) {
                const displayName = KARYAWAN[VALID_USERS.indexOf(currentUser)];
                document.getElementById('userDisplay').textContent = '👤 ' + displayName;
            }
        }

        // LOAD KARYAWAN LIST
        function loadKaryawanList() {
            const datalist = document.getElementById('namaSuggestions');
            datalist.innerHTML = KARYAWAN.map(k => `<option value="${k}">`).join('');
        }

        // CLOCK
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const mins = String(now.getMinutes()).padStart(2, '0');
            const secs = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${mins}:${secs}`;
            
            const formatter = new Intl.DateTimeFormat('id-ID', {
                weekday: 'long',
                day: 'numeric',
                month: 'long',
                year: 'numeric'
            });
            document.getElementById('dateDisplay').textContent = formatter.format(now);
        }

        // LOCATION
        function getLocation() {
            if (!navigator.geolocation) return;

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    currentLat = position.coords.latitude;
                    currentLng = position.coords.longitude;
                    document.getElementById('locationInfo').innerHTML = 
                        '✓ <strong>Lokasi terdeteksi:</strong> ' + 
                        currentLat.toFixed(4) + ', ' + currentLng.toFixed(4);
                },
                (error) => {
                    document.getElementById('locationInfo').innerHTML = 
                        '✗ GPS tidak tersedia: ' + error.message;
                }
            );
        }

        // PHOTO INPUT
        function setupPhotoInput() {
            document.getElementById('fotoInput').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function(event) {
                    currentPhoto = event.target.result;
                    const preview = document.getElementById('photoPreview');
                    preview.src = currentPhoto;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            });
        }

        // SUBMIT CHECKIN
        async function submitCheckin() {
            const nama = document.getElementById('namaInput').value.trim();

            if (!nama) {
                showStatus('Pilih nama karyawan terlebih dahulu', 'error');
                return;
            }

            const btn = event.target;
            btn.disabled = true;
            showStatus('Mengirim data...', 'loading');

            try {
                const payload = {
                    tipe: 'checkin',
                    nama: nama,
                    latitude: currentLat,
                    longitude: currentLng,
                    fotoBase64: currentPhoto
                };

                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (result.success) {
                    showStatus('✓ ' + result.message, 'success');
                    document.getElementById('namaInput').value = '';
                    currentPhoto = null;
                    document.getElementById('photoPreview').style.display = 'none';
                    loadTodayHistory();
                } else {
                    showStatus('⚠ ' + result.message, 'error');
                }
            } catch (error) {
                showStatus('Error: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
            }
        }

        // SUBMIT CHECKOUT
        async function submitCheckout() {
            const nama = document.getElementById('namaInput').value.trim();

            if (!nama) {
                showStatus('Pilih nama karyawan terlebih dahulu', 'error');
                return;
            }

            const btn = event.target;
            btn.disabled = true;
            showStatus('Mengirim data...', 'loading');

            try {
                const payload = {
                    tipe: 'checkout',
                    nama: nama,
                    latitude: currentLat,
                    longitude: currentLng,
                    fotoBase64: currentPhoto
                };

                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (result.success) {
                    showStatus('✓ ' + result.message, 'success');
                    document.getElementById('namaInput').value = '';
                    currentPhoto = null;
                    document.getElementById('photoPreview').style.display = 'none';
                    loadTodayHistory();
                } else {
                    showStatus('⚠ ' + result.message, 'error');
                }
            } catch (error) {
                showStatus('Error: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
            }
        }

        // LOAD TODAY HISTORY
        async function loadTodayHistory() {
            try {
                const response = await fetch(GAS_URL);
                const result = await response.json();

                const historyList = document.getElementById('historyList');

                if (!result.data || result.data.length === 0) {
                    historyList.innerHTML = '<div class="empty">Belum ada absensi hari ini</div>';
                    return;
                }

                historyList.innerHTML = result.data.map(item => `
                    <div class="history-item">
                        <div><strong>${item.nama}</strong></div>
                        <div style="font-size: 11px; color: var(--gray-700);">
                            IN: ${item.checkIn} 
                            ${item.checkOut ? '| OUT: ' + item.checkOut : ''}
                            ${item.durasi ? '| ' + item.durasi + 'h' : ''}
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.log('Error loading history:', error);
            }
        }

        // STATUS MESSAGE
        function showStatus(msg, type) {
            const el = document.getElementById('statusMsg');
            el.textContent = msg;
            el.className = 'status-msg show ' + type;
            
            if (type !== 'loading') {
                setTimeout(() => {
                    el.classList.remove('show');
                }, 3000);
            }
        }
    </script>
</body>
</html>
