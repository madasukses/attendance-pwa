<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="Absensi Nosada Farma">
    <title>Absensi Nosada Farma</title>
    <meta name="theme-color" content="#2196F3">
    <link rel="manifest" href="manifest.json">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        /* ==================== LOGIN PAGE ==================== */
        .page {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
        }

        .page.active {
            display: flex;
        }

        #loginPage {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 12px;
            padding: 30px 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-container h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 10px;
        }

        .login-container p {
            color: #999;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .login-container input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            margin-bottom: 20px;
            background: white;
            color: #333;
        }

        .login-container input:focus {
            outline: none;
            border-color: #667eea;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .login-btn:active {
            background: #5568d3;
        }

        /* ==================== ABSENSI PAGE ==================== */
        #absensiPage {
            background: white;
            justify-content: flex-start;
        }

        .absensi-header {
            background: #2196F3;
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .absensi-header h2 {
            font-size: 18px;
            margin-bottom: 5px;
        }

        .absensi-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .absensi-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 20px;
            gap: 20px;
        }

        #cameraContainer {
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 4/3;
            max-height: 50vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
        }

        #videoPreview {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: #4CAF50;
            color: white;
        }

        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #f44336;
            color: white;
        }

        .btn-tertiary {
            background: #FF9800;
            color: white;
        }

        .status-card {
            background: #f9f9f9;
            border-left: 4px solid #2196F3;
            padding: 15px;
            border-radius: 4px;
            font-size: 14px;
            color: #333;
        }

        .status-card.success {
            border-left-color: #4CAF50;
            background: #f1f8f4;
        }

        .status-card.error {
            border-left-color: #f44336;
            background: #fef5f5;
        }

        .status-card strong {
            display: block;
            margin-bottom: 5px;
            color: #222;
        }

        .log-section {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            max-height: 150px;
            overflow-y: auto;
        }

        .log-section h3 {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .log-entry {
            font-size: 13px;
            color: #555;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .log-entry:last-child {
            border-bottom: none;
        }

        /* ==================== ADMIN PAGE ==================== */
        #adminPage {
            background: white;
        }

        .admin-header {
            background: #333;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-header h2 {
            font-size: 18px;
        }

        .tab-buttons {
            display: flex;
            border-bottom: 2px solid #ddd;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: white;
            border: none;
            font-size: 14px;
            cursor: pointer;
            font-weight: 600;
            color: #999;
            transition: all 0.3s;
        }

        .tab-btn.active {
            color: #2196F3;
            border-bottom: 3px solid #2196F3;
            margin-bottom: -2px;
        }

        .tab-content {
            display: none;
            padding: 15px;
            overflow-y: auto;
            max-height: calc(100vh - 140px);
        }

        .tab-content.active {
            display: block;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        table th {
            background: #f5f5f5;
            padding: 10px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #ddd;
            color: #333;
        }

        table td {
            padding: 10px;
            border-bottom: 1px solid #eee;
            color: #555;
        }

        table tr:hover {
            background: #f9f9f9;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #999;
        }

        /* ==================== UTILITIES ==================== */
        .hidden {
            display: none !important;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #2196F3;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .toastContainer {
            position: fixed;
            top: 10px;
            left: 10px;
            right: 10px;
            z-index: 9999;
        }

        .toast {
            background: #323232;
            color: white;
            padding: 12px 16px;
            border-radius: 4px;
            margin-bottom: 10px;
            animation: slideIn 0.3s ease-out;
            font-size: 14px;
        }

        .toast.success {
            background: #4CAF50;
        }

        .toast.error {
            background: #f44336;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .logout-btn {
            padding: 8px 12px;
            background: #f44336;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .button-group {
                flex-direction: column;
            }

            .login-container {
                padding: 20px 15px;
            }

            .absensi-header {
                padding: 15px;
            }

            .absensi-content {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <!-- TOAST CONTAINER -->
    <div class="toastContainer" id="toastContainer"></div>

    <!-- LOGIN PAGE -->
    <div id="loginPage" class="page active">
        <div class="login-container">
            <h1>📸 Absensi</h1>
            <p>Nosada Farma</p>
            <input type="text" id="karyawanInput" placeholder="Tulis nama karyawan..." autocomplete="off">
            <button class="login-btn" onclick="loginKaryawan()">Masuk</button>
        </div>
    </div>

    <!-- ABSENSI PAGE -->
    <div id="absensiPage" class="page">
        <div class="absensi-header">
            <h2 id="greeting">Selamat Datang</h2>
            <p id="tanggalHari"></p>
            <button class="logout-btn" onclick="logout()">Keluar</button>
        </div>
        <div class="absensi-content">
            <div id="cameraContainer">
                <video id="videoPreview" style="display:none;"></video>
                <div id="cameraPlaceholder">Kamera Diaktifkan...</div>
            </div>
            
            <div class="button-group">
                <button class="btn btn-primary" id="captureBtn" onclick="capturePhoto()">📷 Ambil Foto</button>
                <button class="btn btn-tertiary" id="absenBtn" onclick="toggleAbsen()">📍 ABSEN</button>
                <button class="btn btn-secondary" onclick="toggleAdminView()">👁️ ADMIN</button>
            </div>

            <div id="statusMessage" class="status-card hidden"></div>

            <div class="log-section">
                <h3>Log Hari Ini</h3>
                <div id="absensiLog"></div>
            </div>
        </div>
    </div>

    <!-- ADMIN PAGE -->
    <div id="adminPage" class="page">
        <div class="admin-header">
            <h2>📊 Admin Dashboard</h2>
            <button class="logout-btn" onclick="toggleAdminView()">Kembali</button>
        </div>
        
        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchAdminTab('karyawan')">Karyawan</button>
            <button class="tab-btn" onclick="switchAdminTab('log')">Log Absensi</button>
            <button class="tab-btn" onclick="switchAdminTab('report')">Report Bulanan</button>
        </div>

        <div id="karyawan-tab" class="tab-content active">
            <div class="loading"><div class="spinner"></div> Loading...</div>
        </div>
        <div id="log-tab" class="tab-content">
            <div class="loading"><div class="spinner"></div> Loading...</div>
        </div>
        <div id="report-tab" class="tab-content">
            <div class="loading"><div class="spinner"></div> Loading...</div>
        </div>
    </div>

    <script>
        // CONFIG
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbwd7f0Lc27eCi7o7N5XLba_vKpKUBgOYTsdqeh9fO7F2GWh8pIOl43bdkwYekLMi5rV/exec';
        let currentUser = null;
        let lastPhotoBase64 = null;
        let lastCheckInTime = null;

        // ==================== INITIALIZATION ====================
        window.addEventListener('DOMContentLoaded', () => {
            updateTanggalHari();
            setInterval(updateTanggalHari, 60000);

            // Enter key untuk login
            document.getElementById('karyawanInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    loginKaryawan();
                }
            });

            // Disable pinch zoom
            document.addEventListener('touchmove', (e) => {
                if (e.touches.length > 1) {
                    e.preventDefault();
                }
            }, {passive: false});

            document.addEventListener('gesturestart', (e) => {
                e.preventDefault();
            }, {passive: false});
        });

        function updateTanggalHari() {
            const now = new Date();
            const hari = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'][now.getDay()];
            const tanggal = now.toLocaleDateString('id-ID');
            document.getElementById('tanggalHari').textContent = `${hari}, ${tanggal}`;
        }

        // ==================== LOGIN ====================
        async function loginKaryawan() {
            const namaInput = document.getElementById('karyawanInput').value.trim();

            if (!namaInput) {
                showToast('Tulis nama karyawan terlebih dahulu', 'error');
                return;
            }

            // Get rate dari backend
            try {
                const response = await fetch(`${GAS_URL}?action=getKaryawan`);
                const result = await response.json();
                
                if (result.success && result.data.length > 0) {
                    const karyawan = result.data.find(k => 
                        k.nama.toLowerCase() === namaInput.toLowerCase()
                    );

                    if (karyawan) {
                        currentUser = {
                            nama: karyawan.nama,
                            ratePerJam: karyawan.ratePerJam,
                            tanggal: getTodayDate()
                        };

                        showGreeting();
                        switchPage('absensi');
                        startCamera();
                        loadAbsensiLog();
                    } else {
                        showToast(`Nama "${namaInput}" tidak ditemukan di data karyawan`, 'error');
                    }
                } else {
                    showToast('Gagal load data karyawan', 'error');
                }
            } catch (error) {
                showToast('Error: ' + error, 'error');
            }
        }

        function logout() {
            stopCamera();
            currentUser = null;
            lastPhotoBase64 = null;
            document.getElementById('karyawanInput').value = '';
            switchPage('login');
        }

        function showGreeting() {
            const hour = new Date().getHours();
            let greeting = 'Selamat Pagi';
            if (hour >= 11 && hour < 15) greeting = 'Selamat Siang';
            if (hour >= 15 && hour < 19) greeting = 'Selamat Sore';
            if (hour >= 19) greeting = 'Selamat Malam';

            document.getElementById('greeting').textContent = `${greeting}, ${currentUser.nama} 👋`;
        }

        // ==================== CAMERA ====================
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {facingMode: 'user', width: {ideal: 1280}, height: {ideal: 720}},
                    audio: false
                });

                const video = document.getElementById('videoPreview');
                video.srcObject = stream;
                video.style.display = 'block';
                document.getElementById('cameraPlaceholder').style.display = 'none';
                video.play();
            } catch (error) {
                showToast('Akses kamera ditolak', 'error');
            }
        }

        function stopCamera() {
            const video = document.getElementById('videoPreview');
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
                video.style.display = 'none';
                document.getElementById('cameraPlaceholder').style.display = 'flex';
            }
        }

        function capturePhoto() {
            const video = document.getElementById('videoPreview');
            if (!video.srcObject) {
                showToast('Kamera belum aktif', 'error');
                return;
            }

            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0);

            lastPhotoBase64 = canvas.toDataURL('image/jpeg').split(',')[1];
            showToast('Foto berhasil diambil ✓', 'success');
        }

        // ==================== ABSENSI ====================
        async function toggleAbsen() {
            if (!currentUser) {
                showToast('Pilih karyawan terlebih dahulu', 'error');
                return;
            }

            if (!lastPhotoBase64) {
                showToast('Ambil foto terlebih dahulu', 'error');
                return;
            }

            const now = new Date();
            const jamAbsen = formatTime(now);
            const isCheckIn = !lastCheckInTime;

            // Get GPS
            let latitude = null, longitude = null;
            try {
                const position = await new Promise((resolve, reject) => {
                    navigator.geolocation.getCurrentPosition(resolve, reject);
                });
                latitude = position.coords.latitude;
                longitude = position.coords.longitude;
            } catch (error) {
                showToast('GPS tidak tersedia, lanjut tanpa GPS', 'error');
            }

            try {
                // Upload foto
                await uploadFoto(lastPhotoBase64, jamAbsen);

                // Save absensi
                const response = await fetch(`${GAS_URL}?action=saveAbsensi`, {
                    method: 'POST',
                    payload: JSON.stringify({
                        nama: currentUser.nama,
                        tanggal: currentUser.tanggal,
                        jamAbsen: jamAbsen,
                        latitude: latitude,
                        longitude: longitude,
                        isCheckIn: isCheckIn,
                        ratePerJam: currentUser.ratePerJam
                    })
                });

                const result = await response.json();
                if (result.success) {
                    if (isCheckIn) {
                        lastCheckInTime = jamAbsen;
                        showStatus(`✓ Absen Masuk: ${jamAbsen}`, 'success');
                    } else {
                        showStatus(`✓ Absen Pulang: ${jamAbsen}\nDurasi: ${result.durasi} jam\nGaji: Rp${result.gaji.toLocaleString('id-ID')}`, 'success');
                        lastCheckInTime = null;
                    }
                    loadAbsensiLog();
                } else {
                    showStatus(`❌ ${result.message}`, 'error');
                }
            } catch (error) {
                showStatus(`❌ Gagal absen: ${error}`, 'error');
            }

            lastPhotoBase64 = null;
        }

        async function uploadFoto(base64, jamAbsen) {
            return fetch(`${GAS_URL}?action=uploadFoto`, {
                method: 'POST',
                payload: JSON.stringify({
                    nama: currentUser.nama,
                    tanggal: currentUser.tanggal,
                    jamAbsen: jamAbsen,
                    fotoBase64: base64
                })
            }).then(r => r.json()).catch(() => ({}));
        }

        // ==================== LOG & STATUS ====================
        async function loadAbsensiLog() {
            try {
                const response = await fetch(`${GAS_URL}?action=getLog`);
                const result = await response.json();

                const logDiv = document.getElementById('absensiLog');
                logDiv.innerHTML = '';

                if (result.data && result.data.length > 0) {
                    const todayLogs = result.data.filter(log => 
                        log.nama === currentUser.nama && log.tanggal === currentUser.tanggal
                    );

                    if (todayLogs.length > 0) {
                        todayLogs.forEach(log => {
                            const entry = document.createElement('div');
                            entry.className = 'log-entry';
                            entry.innerHTML = `<strong>${log.jamMasuk}</strong> → ${log.jamPulang || '(pending)'} | ${log.durasi ? log.durasi + ' jam' : ''}`;
                            logDiv.appendChild(entry);
                        });
                    } else {
                        logDiv.innerHTML = '<div class="log-entry">Belum ada absensi hari ini</div>';
                    }
                } else {
                    logDiv.innerHTML = '<div class="log-entry">Belum ada absensi</div>';
                }
            } catch (error) {
                // Silent fail
            }
        }

        function showStatus(message, type) {
            const div = document.getElementById('statusMessage');
            div.textContent = message;
            div.className = `status-card ${type}`;
            div.classList.remove('hidden');

            setTimeout(() => {
                div.classList.add('hidden');
            }, 5000);
        }

        // ==================== ADMIN ====================
        function toggleAdminView() {
            const absensiPage = document.getElementById('absensiPage');
            const adminPage = document.getElementById('adminPage');

            if (absensiPage.classList.contains('active')) {
                absensiPage.classList.remove('active');
                adminPage.classList.add('active');
                loadAdminData();
            } else {
                adminPage.classList.remove('active');
                absensiPage.classList.add('active');
                loadAbsensiLog();
            }
        }

        function switchAdminTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            event.target.classList.add('active');
            document.getElementById(`${tab}-tab`).classList.add('active');

            if (tab === 'karyawan') loadKaryawanTable();
            if (tab === 'log') loadLogTable();
            if (tab === 'report') loadReportTable();
        }

        async function loadAdminData() {
            loadKaryawanTable();
        }

        async function loadKaryawanTable() {
            try {
                const response = await fetch(`${GAS_URL}?action=getKaryawan`);
                const result = await response.json();

                const tab = document.getElementById('karyawan-tab');
                if (result.success && result.data.length > 0) {
                    let html = '<table><tr><th>ID</th><th>Nama</th><th>Rate/Jam</th></tr>';
                    result.data.forEach(k => {
                        html += `<tr><td>${k.id}</td><td>${k.nama}</td><td>Rp${k.ratePerJam.toLocaleString('id-ID')}</td></tr>`;
                    });
                    html += '</table>';
                    tab.innerHTML = html;
                } else {
                    tab.innerHTML = '<div class="loading">Tidak ada data</div>';
                }
            } catch (error) {
                document.getElementById('karyawan-tab').innerHTML = '<div class="loading">Error loading data</div>';
            }
        }

        async function loadLogTable() {
            try {
                const response = await fetch(`${GAS_URL}?action=getLog`);
                const result = await response.json();

                const tab = document.getElementById('log-tab');
                if (result.success && result.data.length > 0) {
                    let html = '<table><tr><th>Tanggal</th><th>Nama</th><th>Masuk</th><th>Pulang</th><th>Durasi</th><th>Gaji</th></tr>';
                    result.data.forEach(log => {
                        html += `<tr>
                            <td>${log.tanggal}</td>
                            <td>${log.nama}</td>
                            <td>${log.jamMasuk}</td>
                            <td>${log.jamPulang || '-'}</td>
                            <td>${log.durasi || '-'}</td>
                            <td>${log.gaji ? 'Rp' + log.gaji.toLocaleString('id-ID') : '-'}</td>
                        </tr>`;
                    });
                    html += '</table>';
                    tab.innerHTML = html;
                } else {
                    tab.innerHTML = '<div class="loading">Tidak ada data</div>';
                }
            } catch (error) {
                document.getElementById('log-tab').innerHTML = '<div class="loading">Error loading data</div>';
            }
        }

        async function loadReportTable() {
            try {
                const response = await fetch(`${GAS_URL}?action=getReport`);
                const result = await response.json();

                const tab = document.getElementById('report-tab');
                if (result.success && result.data.length > 0) {
                    let html = '<table><tr><th>Nama</th><th>Total Jam</th><th>Total Gaji</th></tr>';
                    result.data.forEach(r => {
                        html += `<tr>
                            <td>${r.nama}</td>
                            <td>${r.totalJam.toFixed(2)} jam</td>
                            <td>Rp${r.totalGaji.toLocaleString('id-ID')}</td>
                        </tr>`;
                    });
                    html += '</table>';
                    tab.innerHTML = html;
                } else {
                    tab.innerHTML = '<div class="loading">Tidak ada data</div>';
                }
            } catch (error) {
                document.getElementById('report-tab').innerHTML = '<div class="loading">Error loading data</div>';
            }
        }

        // ==================== UTILITIES ====================
        function switchPage(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(`${page}Page`).classList.add('active');
        }

        function getTodayDate() {
            const now = new Date();
            return now.toISOString().split('T')[0];
        }

        function formatTime(date) {
            const h = String(date.getHours()).padStart(2, '0');
            const m = String(date.getMinutes()).padStart(2, '0');
            const s = String(date.getSeconds()).padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        function showToast(message, type) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);

            setTimeout(() => {
                toast.remove();
            }, 3000);
        }
    </script>
</body>
</html>
