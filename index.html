<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1B8A3E">
    <meta name="description" content="Attendance Pro - Checkin dengan GPS dan Foto">
    <title>Attendance Pro</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1B8A3E;
            --primary-dark: #0F6A2E;
            --success: #10B981;
            --danger: #EF4444;
            --gray-100: #F3F4F6;
            --gray-200: #E5E7EB;
            --gray-300: #D1D5DB;
            --gray-700: #374151;
            --gray-900: #111827;
        }

        html, body {
            height: 100%;
            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fff;
            color: var(--gray-900);
        }

        body {
            display: flex;
            flex-direction: column;
            padding-top: max(12px, env(safe-area-inset-top));
            padding-bottom: env(safe-area-inset-bottom);
        }

        .header {
            background: var(--primary);
            color: white;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 18px;
            font-weight: 600;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding-bottom: 60px;
        }

        .clock-section {
            padding: 32px 20px;
            text-align: center;
            background: linear-gradient(135deg, #f5f5f5 0%, #fafafa 100%);
        }

        .clock {
            font-size: 56px;
            font-weight: 300;
            letter-spacing: 2px;
            font-variant-numeric: tabular-nums;
            color: var(--gray-900);
            font-family: 'Courier New', monospace;
            margin-bottom: 8px;
        }

        .date {
            font-size: 14px;
            color: var(--gray-700);
        }

        .location-card {
            margin: 20px 16px;
            padding: 16px;
            background: white;
            border: 1px solid var(--gray-200);
            border-radius: 8px;
            display: flex;
            gap: 12px;
        }

        .location-icon {
            width: 48px;
            height: 48px;
            background: var(--gray-100);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-size: 24px;
            flex-shrink: 0;
        }

        .location-info {
            flex: 1;
        }

        .location-label {
            font-size: 11px;
            color: var(--gray-700);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .location-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--gray-900);
        }

        .status-badge {
            background: var(--success);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            margin-top: 4px;
            display: inline-block;
        }

        .input-section {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--gray-700);
        }

        input[type="text"],
        select,
        textarea {
            padding: 12px 14px;
            border: 1px solid var(--gray-300);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }

        input[type="text"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(27, 138, 62, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 60px;
        }

        #fotoInput {
            display: none;
        }

        .photo-preview {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
            border-radius: 8px;
            margin-top: 8px;
        }

        .btn {
            padding: 14px 20px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            width: 100%;
        }

        .btn-primary:active {
            background: var(--primary-dark);
        }

        .btn-primary:disabled {
            background: var(--gray-300);
            cursor: not-allowed;
        }

        .btn-secondary {
            background: var(--gray-200);
            color: var(--gray-900);
            width: 100%;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 1px solid var(--gray-200);
            display: flex;
            justify-content: space-around;
            padding-bottom: env(safe-area-inset-bottom);
            z-index: 20;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px 8px;
            color: var(--gray-700);
            background: none;
            border: none;
            border-top: 3px solid transparent;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }

        .nav-item.active {
            color: var(--primary);
            border-top-color: var(--primary);
        }

        .tab-content {
            display: none;
            flex: 1;
            overflow-y: auto;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
        }

        .status-msg {
            padding: 12px 16px;
            margin: 16px;
            border-radius: 8px;
            font-size: 13px;
            display: none;
            animation: slideIn 0.3s ease-out;
        }

        .status-msg.show {
            display: block;
        }

        .status-msg.success {
            background: #DCFCE7;
            color: #166534;
            border: 1px solid #86EFAC;
        }

        .status-msg.error {
            background: #FEE2E2;
            color: #991B1B;
            border: 1px solid #FCA5A5;
        }

        .status-msg.loading {
            background: #DBEAFE;
            color: #1E40AF;
            border: 1px solid #93C5FD;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .history-list {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .history-item {
            padding: 12px;
            background: white;
            border: 1px solid var(--gray-200);
            border-radius: 8px;
        }

        .history-time {
            font-weight: 600;
            color: var(--primary);
            font-size: 14px;
        }

        .history-name {
            font-size: 13px;
            color: var(--gray-700);
            margin-top: 4px;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            color: var(--gray-700);
            text-align: center;
            flex: 1;
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-title">
            <span>📍 Attendance Pro</span>
        </div>
    </div>

    <div id="statusMsg" class="status-msg"></div>

    <div class="container">
        <div id="homeTab" class="tab-content active">
            <div class="clock-section">
                <div class="clock" id="clock">00:00:00</div>
                <div class="date" id="dateDisplay">Senin, 1 Januari 2024</div>
            </div>

            <div class="location-card">
                <div class="location-icon">📍</div>
                <div class="location-info">
                    <div class="location-label">LOKASI SAAT INI</div>
                    <div class="location-name" id="locationName">Memuat lokasi...</div>
                    <div class="status-badge" id="locationStatus">Mencari GPS</div>
                </div>
            </div>

            <div class="input-section">
                <div class="input-group">
                    <label class="input-label">Nama</label>
                    <input type="text" id="namaInput" placeholder="Nama lengkap">
                </div>

                <div class="input-group">
                    <label class="input-label">Jabatan</label>
                    <select id="jabatanInput">
                        <option value="">Pilih jabatan</option>
                        <option value="Manager">Manager</option>
                        <option value="Staff">Staff</option>
                        <option value="Admin">Admin</option>
                        <option value="Driver">Driver</option>
                        <option value="Akuntan">Akuntan</option>
                    </select>
                </div>

                <div class="input-group">
                    <label class="input-label">Foto (Selfie)</label>
                    <button class="btn btn-secondary" id="fotoBtn" onclick="document.getElementById('fotoInput').click()">
                        📸 Ambil Foto
                    </button>
                    <input type="file" id="fotoInput" accept="image/*" capture="environment">
                    <img id="photoPreview" class="photo-preview" style="display: none;">
                </div>

                <div class="input-group">
                    <label class="input-label">Catatan (Opsional)</label>
                    <textarea id="notesInput" placeholder="Catatan tambahan"></textarea>
                </div>

                <button class="btn btn-primary" id="submitBtn" onclick="submitCheckin()">
                    ✓ CHECK IN
                </button>
            </div>
        </div>

        <div id="historyTab" class="tab-content">
            <div class="history-list" id="historyList">
                <div class="empty-state">
                    <div class="empty-icon">⏱️</div>
                    <div>Belum ada riwayat</div>
                </div>
            </div>
        </div>

        <div id="profileTab" class="tab-content">
            <div style="padding: 20px; text-align: center; flex: 1; display: flex; flex-direction: column; justify-content: center;">
                <div style="font-size: 48px; margin-bottom: 16px;">👤</div>
                <h2 style="margin-bottom: 8px;">Attendance Pro v1</h2>
                <p style="color: var(--gray-700); font-size: 13px; margin-bottom: 20px;">
                    Aplikasi checkin dengan GPS dan foto
                </p>
                <div style="background: var(--gray-100); padding: 16px; border-radius: 8px; text-align: left; font-size: 12px; color: var(--gray-700);">
                    <p style="margin-bottom: 8px;"><strong>Fitur:</strong></p>
                    <ul style="margin-left: 16px; line-height: 1.6;">
                        <li>✓ Real-time GPS tracking</li>
                        <li>✓ Camera selfie</li>
                        <li>✓ Auto timestamp</li>
                        <li>✓ Riwayat checkin</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('home')">
            <div>🏠</div>
            <div>Home</div>
        </button>
        <button class="nav-item" onclick="switchTab('history')">
            <div>⏱️</div>
            <div>History</div>
        </button>
        <button class="nav-item" onclick="switchTab('profile')">
            <div>👤</div>
            <div>Profile</div>
        </button>
    </div>

    <script>
        // GAS Web App URL - SUDAH BENAR
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbxA3gm5BYzYxrA-_P9h8JwJqKNkO_gpzyS2IMsRhaQIYt4yEQomdo39DK-IcHTsSFnsAg/exec';

        let currentPhoto = null;
        let currentLat = null;
        let currentLng = null;
        let checkinHistory = JSON.parse(localStorage.getItem('checkinHistory') || '[]');

        document.addEventListener('DOMContentLoaded', function() {
            updateClock();
            getLocation();
            loadHistory();
            setupPhotoInput();
            setInterval(updateClock, 1000);
        });

        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const mins = String(now.getMinutes()).padStart(2, '0');
            const secs = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${mins}:${secs}`;
            
            const formatter = new Intl.DateTimeFormat('id-ID', {
                weekday: 'long',
                day: 'numeric',
                month: 'long',
                year: 'numeric'
            });
            document.getElementById('dateDisplay').textContent = formatter.format(now);
        }

        function getLocation() {
            if (!navigator.geolocation) {
                showStatus('GPS tidak tersedia', 'error');
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    currentLat = position.coords.latitude;
                    currentLng = position.coords.longitude;
                    document.getElementById('locationStatus').textContent = '✓ Terkonfirmasi';
                    document.getElementById('locationStatus').style.background = 'var(--success)';
                    document.getElementById('locationName').textContent = 
                        `${currentLat.toFixed(4)}, ${currentLng.toFixed(4)}`;
                },
                (error) => {
                    showStatus('GPS: ' + error.message, 'error');
                }
            );
        }

        function setupPhotoInput() {
            document.getElementById('fotoInput').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function(event) {
                    currentPhoto = event.target.result;
                    const preview = document.getElementById('photoPreview');
                    preview.src = currentPhoto;
                    preview.style.display = 'block';
                    document.getElementById('fotoBtn').textContent = '✓ Foto Tersimpan';
                    document.getElementById('fotoBtn').style.background = 'var(--success)';
                    document.getElementById('fotoBtn').style.color = 'white';
                };
                reader.readAsDataURL(file);
            });
        }

        async function submitCheckin() {
            const nama = document.getElementById('namaInput').value.trim();
            const jabatan = document.getElementById('jabatanInput').value;
            const notes = document.getElementById('notesInput').value.trim();

            if (!nama) {
                showStatus('Nama harus diisi', 'error');
                return;
            }

            if (!currentPhoto) {
                showStatus('Foto harus diambil', 'error');
                return;
            }

            if (currentLat === null || currentLng === null) {
                showStatus('GPS belum terdeteksi', 'error');
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            showStatus('Mengirim data...', 'loading');

            try {
                const payload = {
                    nama: nama,
                    jabatan: jabatan,
                    latitude: currentLat,
                    longitude: currentLng,
                    alamat: 'Nosada Farma',
                    fotoBase64: currentPhoto,
                    notes: notes
                };

                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (result.success) {
                    showStatus('✓ ' + result.message, 'success');
                    
                    checkinHistory.unshift({
                        nama: nama,
                        jabatan: jabatan,
                        waktu: new Date().toLocaleTimeString('id-ID'),
                        tanggal: new Date().toLocaleDateString('id-ID')
                    });
                    localStorage.setItem('checkinHistory', JSON.stringify(checkinHistory.slice(0, 20)));
                    
                    setTimeout(() => {
                        document.getElementById('namaInput').value = '';
                        document.getElementById('jabatanInput').value = '';
                        document.getElementById('notesInput').value = '';
                        document.getElementById('photoPreview').style.display = 'none';
                        document.getElementById('fotoBtn').textContent = '📸 Ambil Foto';
                        document.getElementById('fotoBtn').style.background = '';
                        document.getElementById('fotoBtn').style.color = '';
                        currentPhoto = null;
                        loadHistory();
                    }, 1500);
                } else {
                    showStatus('Error: ' + result.message, 'error');
                }
            } catch (error) {
                showStatus('Error: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
            }
        }

        function loadHistory() {
            const historyList = document.getElementById('historyList');
            if (checkinHistory.length === 0) {
                historyList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📋</div>
                        <div>Belum ada riwayat checkin</div>
                    </div>
                `;
                return;
            }

            historyList.innerHTML = checkinHistory.map(item => `
                <div class="history-item">
                    <div class="history-time">${item.waktu}</div>
                    <div class="history-name">${item.nama} • ${item.jabatan}</div>
                    <div style="font-size: 11px; color: var(--gray-700); margin-top: 4px;">${item.tanggal}</div>
                </div>
            `).join('');
        }

        function switchTab(tab) {
            const tabs = ['home', 'history', 'profile'];
            tabs.forEach(t => document.getElementById(t + 'Tab').classList.remove('active'));
            document.getElementById(tab + 'Tab').classList.add('active');

            const navItems = document.querySelectorAll('.nav-item');
            navItems.forEach(item => item.classList.remove('active'));
            event.target.closest('.nav-item').classList.add('active');
        }

        function showStatus(msg, type) {
            const el = document.getElementById('statusMsg');
            el.textContent = msg;
            el.className = 'status-msg show ' + type;
            
            if (type !== 'loading') {
                setTimeout(() => {
                    el.classList.remove('show');
                }, 3000);
            }
        }
    </script>
</body>
</html>
