<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1B8A3E">
    <title>Attendance App - Nosada Farma</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1B8A3E 0%, #0d5c2a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #1B8A3E 0%, #0d5c2a 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 13px;
            opacity: 0.9;
        }

        .login-screen, .app-screen {
            padding: 30px 20px;
        }

        .login-screen {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .login-screen input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.2s;
        }

        .login-screen input:focus {
            outline: none;
            border-color: #1B8A3E;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
        }

        .btn-primary {
            background: linear-gradient(135deg, #1B8A3E 0%, #0d5c2a 100%);
            color: white;
            width: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(27, 138, 62, 0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .greeting {
            text-align: center;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .greeting h2 {
            color: #1B8A3E;
            font-size: 18px;
            margin-bottom: 5px;
        }

        .clock {
            font-size: 32px;
            font-weight: bold;
            color: #333;
            font-family: 'Courier New', monospace;
            margin: 10px 0;
        }

        .location-info {
            font-size: 12px;
            color: #666;
            margin-top: 8px;
        }

        .photo-section {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .photo-preview {
            width: 100px;
            height: 100px;
            background: #f5f5f5;
            border-radius: 10px;
            display: none;
            overflow: hidden;
        }

        .photo-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .btn-photo {
            flex: 1;
            background: #FF9800;
            color: white;
        }

        .btn-photo:hover {
            background: #F57C00;
        }

        .btn-photo.has-photo {
            background: #4CAF50;
        }

        .btn-absensi {
            width: 100%;
            background: linear-gradient(135deg, #1B8A3E 0%, #0d5c2a 100%);
            color: white;
            font-size: 18px;
            padding: 16px;
            margin-bottom: 15px;
        }

        .log-section {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .log-section h3 {
            color: #333;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .log-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #1B8A3E;
        }

        .log-status {
            font-weight: 600;
            color: #1B8A3E;
            margin-bottom: 8px;
        }

        .log-time {
            color: #666;
            font-size: 13px;
            margin: 5px 0;
        }

        .log-durasi {
            color: #1B8A3E;
            font-weight: 600;
            font-size: 13px;
            margin-top: 8px;
        }

        .empty {
            text-align: center;
            color: #999;
            font-size: 13px;
            padding: 20px;
        }

        .status-msg {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            max-width: 460px;
            padding: 15px 20px;
            border-radius: 10px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 1000;
        }

        .status-msg.show {
            opacity: 1;
            pointer-events: auto;
        }

        .status-msg.success {
            background: #4CAF50;
            color: white;
        }

        .status-msg.error {
            background: #f44336;
            color: white;
        }

        .status-msg.loading {
            background: #2196F3;
            color: white;
        }

        .btn-logout {
            width: 100%;
            background: #e0e0e0;
            color: #333;
            font-size: 14px;
        }

        .btn-logout:hover {
            background: #d0d0d0;
        }

        #fotoInput {
            display: none;
        }

        .app-screen {
            display: none;
        }

        .app-screen.show {
            display: block;
        }

        .login-screen.hide {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 Absensi Nosada</h1>
            <p>Attendance System</p>
        </div>

        <!-- LOGIN SCREEN -->
        <div class="login-screen">
            <input type="text" id="usernameInput" placeholder="Username" autofocus>
            <button class="btn btn-primary" onclick="login()">Login</button>
        </div>

        <!-- APP SCREEN -->
        <div class="app-screen">
            <div class="greeting">
                <h2 id="greetingText">Selamat Pagi</h2>
                <div class="clock" id="clock">00:00:00</div>
                <div class="location-info" id="locationInfo">🔄 Deteksi lokasi...</div>
            </div>

            <div class="photo-section">
                <button class="btn btn-photo" id="photoBtn" onclick="triggerPhotoInput()">📷 Ambil Foto</button>
                <div class="photo-preview" id="photoPreview">
                    <img id="photoImg" src="">
                </div>
            </div>

            <button class="btn btn-absensi" id="absensiBtn" onclick="submitAbsensi()">ABSENSI</button>

            <div class="log-section">
                <h3>📊 Log Hari Ini</h3>
                <div id="todayLog" class="empty">Memuat...</div>
            </div>

            <button class="btn btn-logout" onclick="logout()">Keluar</button>
        </div>
    </div>

    <!-- Hidden iframe untuk form submission ke GAS -->
    <iframe name="gas-iframe" style="display:none;"></iframe>

    <!-- Hidden file input -->
    <input type="file" id="fotoInput" accept="image/*" capture="environment">

    <!-- Status message -->
    <div class="status-msg" id="statusMsg"></div>

    <script>
        // ===== CONFIG =====
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbwN3FnnbigH0pSCkdtEJrcZ4_YNsuA-0Cs5R4tdYPRXm4FlJYoo_TdxSthB1WHfI92J/exec';
        
        const VALID_USERS = ['mada', 'istri', 'novita', 'dian', 'fara', 'alya'];
        const KARYAWAN = {
            'mada': 'Mada',
            'istri': 'Istri',
            'novita': 'Novita',
            'dian': 'Dian',
            'fara': 'Fara',
            'alya': 'Alya'
        };

        let currentUser = null;
        let currentPhoto = null;
        let currentLat = 0;
        let currentLng = 0;

        // ===== INIT =====
        window.addEventListener('load', () => {
            checkLogin();
            setupPhotoInput();
            
            if (currentUser) {
                updateClock();
                getLocation();
                loadTodayLog();
                setInterval(updateClock, 1000);
                setInterval(loadTodayLog, 30000);
            }
        });

        // ===== LOGIN =====
        function login() {
            const username = document.getElementById('usernameInput').value.trim().toLowerCase();
            
            if (!username) {
                showStatus('Username harus diisi', 'error');
                return;
            }

            if (!VALID_USERS.includes(username)) {
                showStatus('Username tidak ditemukan', 'error');
                return;
            }

            localStorage.setItem('currentUser', username);
            currentUser = username;
            showLoginScreen(false);
            
            updateClock();
            getLocation();
            loadTodayLog();
            setInterval(updateClock, 1000);
            setInterval(loadTodayLog, 30000);
        }

        function checkLogin() {
            const user = localStorage.getItem('currentUser');
            if (user && VALID_USERS.includes(user)) {
                currentUser = user;
                showLoginScreen(false);
            } else {
                showLoginScreen(true);
            }
        }

        function logout() {
            localStorage.removeItem('currentUser');
            currentUser = null;
            currentPhoto = null;
            showLoginScreen(true);
            document.getElementById('usernameInput').value = '';
            document.getElementById('usernameInput').focus();
        }

        function showLoginScreen(show) {
            document.querySelector('.login-screen').classList.toggle('hide', !show);
            document.querySelector('.app-screen').classList.toggle('show', !show);
        }

        // ===== CLOCK & GREETING =====
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const mins = String(now.getMinutes()).padStart(2, '0');
            const secs = String(now.getSeconds()).padStart(2, '0');
            
            document.getElementById('clock').textContent = `${hours}:${mins}:${secs}`;
            
            getGreeting();
        }

        function getGreeting() {
            const hour = new Date().getHours();
            let greeting = 'Selamat Pagi';
            
            if (hour >= 12 && hour < 15) greeting = 'Selamat Siang';
            else if (hour >= 15 && hour < 18) greeting = 'Selamat Sore';
            else if (hour >= 18) greeting = 'Selamat Malam';
            
            const nama = KARYAWAN[currentUser] || 'Guest';
            document.getElementById('greetingText').textContent = `${greeting}, ${nama}`;
        }

        // ===== LOCATION =====
        function getLocation() {
            if (!navigator.geolocation) return;

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    currentLat = position.coords.latitude;
                    currentLng = position.coords.longitude;
                    document.getElementById('locationInfo').innerHTML = 
                        '✓ <strong>Lokasi terdeteksi:</strong> ' + 
                        currentLat.toFixed(4) + ', ' + currentLng.toFixed(4);
                },
                (error) => {
                    document.getElementById('locationInfo').innerHTML = 
                        '✗ GPS tidak tersedia';
                }
            );
        }

        // ===== PHOTO INPUT =====
        function setupPhotoInput() {
            document.getElementById('fotoInput').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    currentPhoto = event.target.result;
                    
                    const preview = document.getElementById('photoPreview');
                    const img = document.getElementById('photoImg');
                    
                    img.src = currentPhoto;
                    preview.style.display = 'block';
                    
                    document.getElementById('photoBtn').classList.add('has-photo');
                    document.getElementById('photoBtn').textContent = '✓ Foto OK';
                };
                
                reader.readAsDataURL(file);
            });
        }

        function triggerPhotoInput() {
            document.getElementById('fotoInput').click();
        }

        // ===== SUBMIT ABSENSI (1 TOMBOL - SMART LOGIC) =====
        function submitAbsensi() {
            if (!currentPhoto) {
                showStatus('Ambil foto terlebih dahulu!', 'error');
                return;
            }

            const btn = document.getElementById('absensiBtn');
            btn.disabled = true;
            showStatus('Memproses...', 'loading');

            const nama = KARYAWAN[currentUser];
            const now = new Date();
            const waktu = String(now.getHours()).padStart(2, '0') + ':' + 
                         String(now.getMinutes()).padStart(2, '0') + ':' +
                         String(now.getSeconds()).padStart(2, '0');
            
            const todayAttendance = JSON.parse(localStorage.getItem('todayAttendance') || '[]');
            
            // Cari record user hari ini
            const existingIndex = todayAttendance.findIndex(item => item.nama === nama);
            
            if (existingIndex === -1) {
                // ===== KLIK 1: JAM MASUK =====
                todayAttendance.push({
                    nama: nama,
                    jamMasuk: waktu,
                    jamPulang: '',
                    durasi: 0,
                    gaji: 0
                });
                
                localStorage.setItem('todayAttendance', JSON.stringify(todayAttendance));
                
                setTimeout(() => {
                    showStatus('✓ Jam Masuk: ' + waktu, 'success');
                    
                    // Reset foto
                    currentPhoto = null;
                    document.getElementById('photoPreview').style.display = 'none';
                    document.getElementById('photoBtn').classList.remove('has-photo');
                    document.getElementById('photoBtn').textContent = '📷 Ambil Foto';
                    btn.disabled = false;
                    
                    loadTodayLog();
                    
                    // Submit ke GAS untuk backup (background)
                    submitToGAS(nama, waktu);
                }, 500);
                
            } else {
                // ===== KLIK 2+: JAM PULANG (BISA DIULANG) =====
                const record = todayAttendance[existingIndex];
                const jamMasuk = record.jamMasuk;
                
                // Hitung durasi
                const [hm, mm, sm] = jamMasuk.split(':').map(Number);
                const [hp, mp, sp] = waktu.split(':').map(Number);
                
                const masuk = hm * 3600 + mm * 60 + sm;
                const pulang = hp * 3600 + mp * 60 + sp;
                const durasiDetik = pulang - masuk;
                const durasi = Math.round((durasiDetik / 3600) * 100) / 100;
                
                const gajiPerJam = 30000;
                const gaji = durasi * gajiPerJam;
                
                // Update record
                record.jamPulang = waktu;
                record.durasi = durasi;
                record.gaji = gaji;
                
                localStorage.setItem('todayAttendance', JSON.stringify(todayAttendance));
                
                setTimeout(() => {
                    showStatus('✓ Jam Pulang: ' + waktu + ' (' + durasi + 'h)', 'success');
                    
                    currentPhoto = null;
                    document.getElementById('photoPreview').style.display = 'none';
                    document.getElementById('photoBtn').classList.remove('has-photo');
                    document.getElementById('photoBtn').textContent = '📷 Ambil Foto';
                    btn.disabled = false;  // ← TETAP AKTIF, BISA DIULANG!
                    
                    loadTodayLog();
                    
                    // Submit ke GAS untuk backup (background)
                    submitToGAS(nama, waktu);
                }, 500);
            }
        }

        // ===== SUBMIT KE GAS (background, form submission) =====
        function submitToGAS(nama, waktu) {
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = GAS_URL;
            form.style.display = 'none';
            form.target = 'gas-iframe';

            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = 'data';
            input.value = JSON.stringify({
                nama: nama,
                latitude: currentLat,
                longitude: currentLng,
                fotoBase64: currentPhoto
            });

            form.appendChild(input);
            document.body.appendChild(form);
            form.submit();
            
            setTimeout(() => {
                document.body.removeChild(form);
            }, 1000);
        }

        // ===== LOAD TODAY LOG (dari localStorage) =====
        function loadTodayLog() {
            const logDiv = document.getElementById('todayLog');
            const nama = KARYAWAN[currentUser];
            const todayAttendance = JSON.parse(localStorage.getItem('todayAttendance') || '[]');

            // Filter hanya user hari ini
            const userLog = todayAttendance.find(item => item.nama === nama);

            if (!userLog) {
                logDiv.innerHTML = '<div class="empty">Belum ada absensi</div>';
                return;
            }

            let html = `
                <div class="log-item">
                    <div class="log-status">✓ 1x Absen</div>
                    <div class="log-time">
                        🔵 Jam Masuk: ${userLog.jamMasuk}
                    </div>
            `;

            if (userLog.jamPulang) {
                html += `
                    <div class="log-time">
                        🔴 Jam Pulang: ${userLog.jamPulang}
                    </div>
                    <div class="log-durasi">
                        ⏱ Durasi: ${userLog.durasi} jam | Gaji: Rp ${userLog.gaji.toLocaleString('id-ID')}
                    </div>
                `;
            } else {
                html += `
                    <div class="log-time">
                        ⏳ Sedang bekerja...
                    </div>
                `;
            }

            html += '</div>';
            logDiv.innerHTML = html;
        }

        // ===== STATUS MESSAGE =====
        function showStatus(msg, type) {
            const el = document.getElementById('statusMsg');
            el.textContent = msg;
            el.className = 'status-msg show ' + type;
            
            if (type !== 'loading') {
                setTimeout(() => {
                    el.classList.remove('show');
                }, 3000);
            }
        }
    </script>

    <!-- PWA Service Worker (optional) -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }
    </script>
</body>
</html>
