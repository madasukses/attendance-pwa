<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1B8A3E">
    <title>Attendance - Nosada Farma</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1B8A3E;
            --primary-dark: #0F6A2E;
            --success: #10B981;
            --danger: #EF4444;
            --gray-100: #F3F4F6;
            --gray-200: #E5E7EB;
            --gray-300: #D1D5DB;
            --gray-700: #374151;
            --gray-900: #111827;
        }

        html, body {
            height: 100%;
            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fff;
            color: var(--gray-900);
        }

        body {
            display: flex;
            flex-direction: column;
            padding-top: max(12px, env(safe-area-inset-top));
        }

        .header {
            background: var(--primary);
            color: white;
            padding: 16px 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 20px;
        }

        /* LOGIN */
        .login-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        .login-box {
            width: 100%;
            max-width: 300px;
        }

        .login-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .login-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .login-subtitle {
            font-size: 13px;
            color: var(--gray-700);
            margin-bottom: 24px;
        }

        .login-input {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--gray-300);
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 12px;
            font-family: inherit;
        }

        .login-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(27, 138, 62, 0.1);
        }

        .btn {
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:active {
            background: var(--primary-dark);
        }

        .btn-logout {
            background: var(--gray-200);
            color: var(--gray-900);
            font-size: 12px;
            padding: 8px 12px;
            width: auto;
            margin-top: 20px;
        }

        /* MAIN */
        .main-screen {
            display: none;
        }

        .main-screen.active {
            display: flex;
            flex-direction: column;
        }

        .status-msg {
            padding: 12px 16px;
            margin-bottom: 16px;
            border-radius: 8px;
            font-size: 13px;
            display: none;
            animation: slideIn 0.3s;
        }

        .status-msg.show {
            display: block;
        }

        .status-msg.success {
            background: #DCFCE7;
            color: #166534;
            border: 1px solid #86EFAC;
        }

        .status-msg.error {
            background: #FEE2E2;
            color: #991B1B;
            border: 1px solid #FCA5A5;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .greeting-section {
            text-align: center;
            padding: 24px 20px;
            background: linear-gradient(135deg, #f5f5f5 0%, #fafafa 100%);
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .greeting-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .greeting-text {
            font-size: 24px;
            font-weight: 600;
            color: var(--gray-900);
            margin-bottom: 4px;
        }

        .greeting-user {
            font-size: 12px;
            color: var(--gray-700);
        }

        .clock {
            font-size: 36px;
            font-weight: 300;
            letter-spacing: 2px;
            font-variant-numeric: tabular-nums;
            font-family: 'Courier New', monospace;
            margin-top: 8px;
        }

        .location-info {
            padding: 12px;
            background: var(--gray-100);
            border-radius: 8px;
            font-size: 12px;
            color: var(--gray-700);
            margin-bottom: 20px;
        }

        #fotoInput {
            display: none;
        }

        .photo-section {
            margin-bottom: 20px;
        }

        .photo-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--gray-900);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .photo-preview {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 8px;
            border: 2px solid var(--gray-300);
        }

        .photo-preview.has-image {
            border-color: var(--success);
        }

        .btn-photo {
            width: 100%;
            padding: 16px;
            background: var(--gray-200);
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }

        .btn-photo:active {
            background: var(--gray-300);
        }

        .btn-photo.has-photo {
            background: var(--success);
            color: white;
        }

        .btn-absensi {
            width: 100%;
            padding: 24px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            background: var(--primary);
            color: white;
            transition: all 0.3s;
        }

        .btn-absensi:active:not(:disabled) {
            background: var(--primary-dark);
        }

        .btn-absensi:disabled {
            background: var(--gray-300);
            cursor: not-allowed;
            opacity: 0.5;
        }

        .log-section {
            padding: 16px;
            background: var(--gray-100);
            border-radius: 8px;
            font-size: 12px;
            margin-top: 20px;
        }

        .log-title {
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--gray-900);
        }

        .log-item {
            padding: 12px;
            background: white;
            border-radius: 6px;
            border-left: 4px solid var(--primary);
        }

        .log-status {
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 4px;
        }

        .log-time {
            font-size: 11px;
            color: var(--gray-700);
            line-height: 1.6;
        }

        .log-durasi {
            font-size: 11px;
            color: var(--gray-700);
            margin-top: 4px;
            font-weight: 500;
        }

        .empty {
            text-align: center;
            padding: 20px;
            color: var(--gray-700);
        }
    </style>
</head>
<body>
    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="login-screen">
        <div class="login-box">
            <div class="login-icon">🏢</div>
            <div class="login-title">Nosada Farma</div>
            <div class="login-subtitle">Sistem Absensi</div>
            
            <input 
                type="text" 
                id="usernameInput" 
                class="login-input" 
                placeholder="Username"
                autocomplete="off"
            >
            
            <button class="btn btn-primary" onclick="login()">Masuk</button>
        </div>
    </div>

    <!-- MAIN SCREEN -->
    <div id="mainScreen" class="main-screen">
        <div class="header">
            <h1>📍 Attendance Nosada</h1>
        </div>

        <div class="container">
            <div id="statusMsg" class="status-msg"></div>

            <!-- GREETING -->
            <div class="greeting-section">
                <div class="greeting-icon" id="greetingIcon">👋</div>
                <div class="greeting-text" id="greetingText">Selamat Pagi</div>
                <div class="greeting-user" id="userName">User</div>
                <div class="clock" id="clock">00:00:00</div>
            </div>

            <!-- LOCATION -->
            <div class="location-info" id="locationInfo">
                📍 Mencari lokasi...
            </div>

            <!-- PHOTO -->
            <div class="photo-section">
                <div class="photo-label">📸 Foto Selfie</div>
                <img id="photoPreview" class="photo-preview" style="display: none;">
                <button class="btn-photo" id="photoBtn" onclick="document.getElementById('fotoInput').click()">
                    📷 Ambil Foto
                </button>
                <input type="file" id="fotoInput" accept="image/*" capture="user">
            </div>

            <!-- TOMBOL ABSENSI (SATU-SATUNYA) -->
            <button class="btn-absensi" id="absensiBtn" onclick="submitAbsensi()" disabled>
                ✓ ABSENSI
            </button>

            <!-- LOG HARI INI -->
            <div class="log-section">
                <div class="log-title">📋 Absensi Hari Ini</div>
                <div id="todayLog" class="empty">Belum ada absensi</div>
            </div>

            <!-- LOGOUT -->
            <button class="btn btn-logout" onclick="logout()">Keluar</button>
        </div>
    </div>

    <script>
        // CONFIG
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbxc7YDPcq_7BUdf_Pdj-CoD41NPDuiCpu5VI2gQsMik_R0xn_AE33rmw1YUgKKKknH8Ag/exec';
        const VALID_USERS = ['mada', 'istri', 'novita', 'dian', 'fara', 'alya'];
        const KARYAWAN = {
            'mada': 'Mada',
            'istri': 'Istri',
            'novita': 'Novita',
            'dian': 'Dian',
            'fara': 'Fara',
            'alya': 'Alya'
        };

        let currentUser = null;
        let currentPhoto = null;
        let currentLat = null;
        let currentLng = null;
        let hasCheckinToday = false;

        // INIT
        document.addEventListener('DOMContentLoaded', function() {
            checkLogin();
            setupPhotoInput();
            
            if (currentUser) {
                updateClock();
                getLocation();
                loadTodayLog();
                setInterval(updateClock, 1000);
                setInterval(loadTodayLog, 30000);
            }
        });

        // LOGIN
        function login() {
            const username = document.getElementById('usernameInput').value.trim().toLowerCase();
            
            if (!username) {
                showStatus('Username harus diisi', 'error');
                return;
            }

            if (!VALID_USERS.includes(username)) {
                showStatus('Username tidak ditemukan', 'error');
                return;
            }

            localStorage.setItem('currentUser', username);
            currentUser = username;
            showLoginScreen(false);
            
            updateClock();
            getLocation();
            loadTodayLog();
            setInterval(updateClock, 1000);
            setInterval(loadTodayLog, 30000);
        }

        function checkLogin() {
            const user = localStorage.getItem('currentUser');
            if (user && VALID_USERS.includes(user)) {
                currentUser = user;
                showLoginScreen(false);
            } else {
                showLoginScreen(true);
            }
        }

        function logout() {
            if (confirm('Keluar dari aplikasi?')) {
                localStorage.removeItem('currentUser');
                currentUser = null;
                showLoginScreen(true);
                document.getElementById('usernameInput').value = '';
            }
        }

        function showLoginScreen(show) {
            document.getElementById('loginScreen').style.display = show ? 'flex' : 'none';
            document.getElementById('mainScreen').classList.toggle('active', !show);
        }

        // GREETING
        function getGreeting() {
            const hour = new Date().getHours();
            const userName = KARYAWAN[currentUser];
            
            let greeting = '';
            let icon = '';
            
            if (hour >= 5 && hour < 12) {
                greeting = 'Selamat Pagi';
                icon = '🌅';
            } else if (hour >= 12 && hour < 15) {
                greeting = 'Selamat Siang';
                icon = '☀️';
            } else if (hour >= 15 && hour < 18) {
                greeting = 'Selamat Sore';
                icon = '🌤️';
            } else {
                greeting = 'Selamat Malam';
                icon = '🌙';
            }
            
            document.getElementById('greetingIcon').textContent = icon;
            document.getElementById('greetingText').textContent = greeting;
            document.getElementById('userName').textContent = userName;
        }

        // CLOCK
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const mins = String(now.getMinutes()).padStart(2, '0');
            const secs = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${mins}:${secs}`;
            
            getGreeting();
        }

        // LOCATION
        function getLocation() {
            if (!navigator.geolocation) return;

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    currentLat = position.coords.latitude;
                    currentLng = position.coords.longitude;
                    document.getElementById('locationInfo').innerHTML = 
                        '✓ <strong>Lokasi terdeteksi:</strong> ' + 
                        currentLat.toFixed(4) + ', ' + currentLng.toFixed(4);
                },
                (error) => {
                    document.getElementById('locationInfo').innerHTML = 
                        '✗ GPS tidak tersedia';
                }
            );
        }

        // PHOTO INPUT
        function setupPhotoInput() {
            document.getElementById('fotoInput').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function(event) {
                    currentPhoto = event.target.result;
                    const preview = document.getElementById('photoPreview');
                    preview.src = currentPhoto;
                    preview.style.display = 'block';
                    
                    const photoBtn = document.getElementById('photoBtn');
                    photoBtn.classList.add('has-photo');
                    photoBtn.textContent = '✓ Foto Tersimpan';
                    
                    // Enable absensi button
                    document.getElementById('absensiBtn').disabled = false;
                };
                reader.readAsDataURL(file);
            });
        }

        // SUBMIT ABSENSI (1 TOMBOL - SMART LOGIC)
        async function submitAbsensi() {
            if (!currentPhoto) {
                showStatus('Ambil foto terlebih dahulu!', 'error');
                return;
            }

            const btn = document.getElementById('absensiBtn');
            btn.disabled = true;
            showStatus('Memproses...', 'loading');

            try {
                const nama = KARYAWAN[currentUser];
                const payload = {
                    nama: nama,
                    latitude: currentLat,
                    longitude: currentLng,
                    fotoBase64: currentPhoto
                };

                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (result.success) {
                    showStatus('✓ ' + result.message, 'success');
                    
                    if (result.type === 'masuk') {
                        // Klik 1: Jam Masuk
                        hasCheckinToday = true;
                        currentPhoto = null;
                        document.getElementById('photoPreview').style.display = 'none';
                        document.getElementById('photoBtn').classList.remove('has-photo');
                        document.getElementById('photoBtn').textContent = '📷 Ambil Foto';
                        btn.disabled = false;
                    } else if (result.type === 'pulang') {
                        // Klik 2: Jam Pulang
                        hasCheckinToday = false;
                        btn.disabled = true;
                    }
                    
                    loadTodayLog();
                } else {
                    showStatus('⚠ ' + result.message, 'error');
                    btn.disabled = false;
                }
            } catch (error) {
                showStatus('Error: ' + error.message, 'error');
                btn.disabled = false;
            }
        }

        // LOAD LOG HARI INI
        async function loadTodayLog() {
            try {
                const response = await fetch(GAS_URL);
                const result = await response.json();

                const logDiv = document.getElementById('todayLog');
                const nama = KARYAWAN[currentUser];

                if (!result.data || result.data.length === 0) {
                    logDiv.innerHTML = '<div class="empty">Belum ada absensi</div>';
                    return;
                }

                // Filter hanya user hari ini
                const userLog = result.data.find(item => item.nama === nama);

                if (!userLog) {
                    logDiv.innerHTML = '<div class="empty">Belum ada absensi</div>';
                    return;
                }

                let html = `
                    <div class="log-item">
                        <div class="log-status">1x Absen</div>
                        <div class="log-time">
                            🔵 Jam Masuk: ${userLog.jamMasuk}
                        </div>
                `;

                if (userLog.jamPulang) {
                    html += `
                        <div class="log-time">
                            🔴 Jam Pulang: ${userLog.jamPulang}
                        </div>
                        <div class="log-durasi">
                            ⏱ Durasi: ${userLog.durasi} jam | Gaji: Rp ${userLog.gaji.toLocaleString('id-ID')}
                        </div>
                    `;
                } else {
                    html += `
                        <div class="log-time">
                            ⏳ (Belum pulang)
                        </div>
                    `;
                }

                html += '</div>';
                logDiv.innerHTML = html;

            } catch (error) {
                console.log('Error loading log:', error);
            }
        }

        // STATUS MESSAGE
        function showStatus(msg, type) {
            const el = document.getElementById('statusMsg');
            el.textContent = msg;
            el.className = 'status-msg show ' + type;
            
            if (type !== 'loading') {
                setTimeout(() => {
                    el.classList.remove('show');
                }, 3000);
            }
        }
    </script>
</body>
</html>
